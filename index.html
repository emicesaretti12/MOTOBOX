<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MotoBox CRM - Sistema de gestión de leads para concesionario de motos" />
    <title>MotoBox CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Aplica el tema guardado antes de pintar, para que no haya un parpadeo
      // claro/oscuro al cargar. Si falla, queda el tema claro por defecto.
      (function () {
        try {
          var modo = localStorage.getItem('motobox.theme') || 'light'
          var oscuro = modo === 'dark' || (modo === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var tema = oscuro ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', tema)
          document.documentElement.style.colorScheme = tema
          document.documentElement.setAttribute('data-density', localStorage.getItem('motobox.density') || 'comfortable')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
